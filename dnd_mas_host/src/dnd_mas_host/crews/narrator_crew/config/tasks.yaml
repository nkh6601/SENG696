validate_prompt:
  description: >
    ONLY validate the player's prompt for conflicts, invalid actions, or ambiguities.
    DO NOT extract actions or generate narratives - only check if the prompt is valid.

    Review the following information to validate the player's prompt:

    Campaign: {campaign}
    Player: {player}
    Player Character: {player_character}
    Current Venue: {current_venue_obj}
    Current Stage: {current_stage_obj}
    Active NPCs: {active_npcs}
    Player's Prompt: "{prompt}"

    INSTRUCTIONS:
    - DO NOT use vector search tools - all context is provided above
    - Verify referenced NPCs exist in active_npcs list
    - Check if action is possible in current venue environment (current_venue_obj)
    - Detect conflicts with game state (e.g., targeting dead NPCs, using items not in inventory)
    - Flag ambiguous actions requiring clarification
    - Maximum tool usage: 0 (all data provided in context)

    Determine:
    - Does the prompt conflict with current game state?
    - Does the prompt request an impossible action?
    - Is the prompt ambiguous or unclear to an extent largely affecting understanding the action?
    - Does the prompt align with campaign story and current venue?

    If invalid, provide a clear message stating the invalid reason and ask for another prompt in one sentence.
    If ambiguous, provide a clear message requesting clarification from the player in one sentence.
    If valid, confirm the prompt can proceed to action extraction.

  expected_output: >
    A JSON format validation result, which includes:
    - valid: Boolean indicating if the prompt is valid
    - message: Validation message or clarification request
  agent: prompt_validator

action_extract:
  description: >
    ONLY extract and structure the action from the player's prompt.
    DO NOT validate the prompt or generate narratives - only parse the action data.

    Extract structured action data from the following validated prompt:

    Campaign: {campaign}
    Player: {player}
    Player Character: {player_character}
    Current Venue: {current_venue_obj}
    Active NPCs: {active_npcs}
    Player's Prompt: "{prompt}"

    INSTRUCTIONS:
    - DO NOT use vector search tools - all context is provided above
    - Extract action details from prompt using provided context
    - Use player_character inventory/spell slots to validate capability
    - Use active_npcs list to identify targets
    - Use current_venue_obj supported_actions to validate action type
    - Maximum tool usage: 0 (all data provided in context)

    Extract the following components:
    - action_type: Type of action (e.g., attack, investigate, talk, move, cast_spell)
    - target: Target of the action (NPC, object, location)
    - method: Method or approach (e.g., "sneak attack", "persuade", "use lockpick")
    - intent: Player's stated or implied intent
    - context: All relevant information (environment, player status, equipment used)

    Be objective and factual - don't add narrative flourish or interpretation.
    Include ALL relevant context needed for Judge and NPC agents to evaluate the action.

    This is ONLY action extraction - if it's something related to validation or narrative,
    state that it is NOT an action extraction matter.
  expected_output: >
    A JSON format action extraction result, which includes:
    - action_type: Type of action
    - target: Target of the action
    - method: Method or approach
    - intent: Player's intent
  agent: action_extractor

narrative_task:
  description: >
    ONLY generate engaging narratives based on action results and game events.
    DO NOT validate prompts or extract actions - only create the story narrative.

    Generate narrative based on the following action results:

    Campaign: {campaign}
    Player: {player}
    Player Character: {player_character}
    Current Venue: {current_venue_obj}
    Current Stage: {current_stage_obj}
    Active NPCs: {active_npcs}
    Action Taken: {action}
    Action Effect: {effect}
    NPC Reactions: {reactions}

    INSTRUCTIONS:
    - Use MonsterVectorSearchTool ONLY for combat descriptions (enemy abilities)
    - Use SpellVectorSearchTool ONLY for spell effect descriptions
    - DO NOT search for venue, NPC, or stage info - provided in context
    - Use current_venue_obj for atmospheric descriptions
    - Use active_npcs for NPC personality/dialogue
    - Use current_stage_obj for story context
    - Maximum tool usage: 2 (Monster + Spell only if needed)

    Create a compelling 1-3 sentence narrative that:
    - Combines third-person descriptions with character dialogue where appropriate
    - Weaves together action results, NPC reactions, and environmental changes
    - Maintains consistency with campaign story and current venue
    - Includes all relevant information from the action result
    - Tracks story progress and character development
    - Is vivid and immersive while staying concise

    Format as a list of narrative segments, each with a speaker:
    - "Narrator" for third-person descriptions
    - Player name for player character dialogue
    - NPC names for NPC dialogue

    This is ONLY narrative generation - if it's something related to validation or action extraction,
    state that it is NOT a narrative matter.
  expected_output: >
    A JSON format narrative data, which includes:
    - narrative: Generated narrative text
    - state_updates: Game state updates (HP changes, venue changes, NPC status, etc.)
  agent: narrative_generator

generate_npc_narratives:
  description: >
    Generate narratives for all NPC reactions in a single batch.

    Campaign: {campaign}
    Current Venue: {venue}
    NPC Reactions: {npc_reactions}

    NPC_REACTIONS FORMAT:
    [
      {{
        "name": "NPC name",
        "personality": "NPC personality traits",
        "description": "NPC physical description",
        "action": {{"action_type": "...", "target": "...", "method": "..."}},
        "roll_result": 15,
        "consequence": "Effect of NPC action"
      }},
      ...
    ]

    INSTRUCTIONS:
    - Generate a cohesive narrative for ALL NPC reactions
    - Use MonsterVectorSearchTool ONLY for combat abilities
    - Use SpellVectorSearchTool ONLY for spell effects
    - DO NOT search for NPC info - provided in npc_reactions
    - Order reactions logically (e.g., faster NPCs first)
    - Show personality through dialogue and actions
    - Maximum tool usage: 2 (Monster + Spell only if needed)

    Create a flowing narrative that combines all NPC actions, showing their distinct
    personalities and tactical decisions. Use dialogue and environmental details to
    bring each NPC to life.
  expected_output: >
    Combined narrative string describing all NPC reactions in sequence.
  agent: npc_narrative_generator