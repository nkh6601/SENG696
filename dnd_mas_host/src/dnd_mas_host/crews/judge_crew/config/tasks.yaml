check_feasibility:
  description: >
    Validate whether the following action is legal and feasible according to D&D 5E 2014 rules.

    Action Details: {action}

    Context: {state_text}
    
    

    Instructions: 
    - Use as few vector search tools as possible, with a maximum of two times.


    Consider the following aspects:
    - Environmental Constraints: Is the action possible in the current environment?    
    - Physical Limitations: Can the action be performed given character's position/condition?
    - Spell Components: For spells, are verbal, somatic, and material components available?
    - Class Features & Feats: Does the player have the required class features or feats?
    - Use the action in venue as a referenced. The player's action may valid even if it is not similar to those actions provided in venue.
    - Resource Availability: Does the player have required resources (spell slots, items, etc.)?

    If the action is invalid, provide a clear, user-friendly explanation of why it cannot be performed.
    Make sure to search the D&D 5E 2014 rule book for relevant rules.

    This is ONLY a feasibility check - if it's something related to difficulty or consequences, you do not to consider it.
  expected_output: >
    A JSON format feasibility check result, which includes:
    - is_valid: Boolean indicating if the action is valid
    - reasoning: Detailed explanation of why the action is valid or invalid
    - rejection_message: User-friendly message if action is invalid (null if valid)
  agent: feasibility_agent

assign_difficulty:
  description: >
    Assign an appropriate Difficulty Class (DC) for the following action based on D&D 5E 2014 rules and context.
    
    Action Details: {action}

    Context:     {state_text}


    INSTRUCTIONS:    
    - Use as few vector search tools as possible, with a maximum of two times (Monster + Rule)
    - Use MonsterVectorSearchTool to get enemy AC/saves if attacking NPC
    - Use RuleVectorSearchTool for DC guidelines (PHB Chapter 8)
    - Use ConditionVectorSearchTool if player has status effects
    - Use the action in venue as a referenced only if player's action is similar, and adjust the difficulty based on that value.
    - DO NOT search VenueVectorSearchTool - modifiers provided in current_venue_obj
    - Check player_character conditions for disadvantage/advantage

    The difficulty level is indicated by a number between -1 to 21:
    - -1: Automatically succeeds (no check needed)
    - 5: Easy task
    - 10: Medium difficulty
    - 15: Hard task
    - 20: Very hard task
    - 21: Impossible (automatically fails)

    Consider the following factors when assigning difficulty:
    - Character abilities and proficiencies
    - Environmental conditions from current_venue_obj
    - Enemy or obstacle characteristics
    - Situational modifiers (advantage, disadvantage)
    - Time pressure or stress factors
    - Equipment and tools available

    Provide clear reasoning for the assigned difficulty level.

  expected_output: >
    A JSON format difficulty assignment, which includes:
    - difficulty: The DC value from -1 to 21
    - reasoning: Detailed explanation of why this DC was assigned
    - skip_check: Boolean indicating if difficulty check should be skipped (true for -1 or 21)
  agent: difficulty_agent

evaluate_consequence:
  description: >
    Evaluate and describe the mechanical consequences of the following action based on whether it succeeded or failed.

    Action Details: {action}
    Roll Result: {roll}

    {state_text}
    

    INSTRUCTIONS:
    - Use as few vector search tools as possible, with a maximum of two times.
    - Use MonsterVectorSearchTool for damage calculations
    - Use SpellVectorSearchTool for spell effects
    - Use ConditionVectorSearchTool for status conditions
    - Use RuleVectorSearchTool for edge cases
    - DO NOT search for venue/NPC info - provided in context
    - Update HP, conditions, resources based on D&D 5E rules

    Based on the success/failure outcome, determine:
    - HP changes (damage dealt/taken, healing)
    - Status conditions (stunned, prone, blinded, etc.)
    - Position changes (movement, forced movement, falling)
    - Resource expenditure (spell slots, items consumed)
    - Environmental changes (doors opened, traps triggered)
    - Secondary effects (reactions triggered, opportunity attacks)
    - Story impacts (NPC reactions, quest progress)

    Combine D&D 5E 2014 rules, {campaign} information, current game status from provided context, and common sense.
    Describe impacts on {player}, other characters (from active_npcs), environment (from current_venue_obj), and story.
    Estimate the in-game time the action took.

    Focus on mechanical effects - the Narrator will handle narrative descriptions.

  expected_output: >
    A JSON format consequence evaluation, which includes:
    - effect_type: Type of effect, including "damage", "healing", "movement", "status_effect", "item_change", "venue_change", "stage_change", "npc_state_change", and "environmental".
    - effect: Detailed description of mechanical impacts (HP, conditions, position, resources)
    - reasoning: Explanation of why these consequences occurred based on D&D 5E rules
    - time_used: Estimated in-game time the action took (e.g., "6 seconds", "1 minute", "1 hour")

    # Type-specific fields (conditionally required)
    # DAMAGE
    damage_amount: Amount of damage dealt
    damage_type: Type of damage (slashing, fire, etc.)

    # HEALING
    healing_amount: Amount of HP restored

    # MOVEMENT
    new_location: New venue/stage name

    # STATUS_EFFECT
    status_effect: Status effect applied (poisoned, stunned, etc.
    duration: Duration in turns

    # ITEM_CHANGE
    item_gained: Item added to inventory
    item_lost: Item removed from inventory

    # NPC_STATE_CHANGE
    npc_state_change: Changes to NPC state (e.g., attitude, intentions)

  agent: consequence_agent