[project]
name = "dnd_mas_host"
version = "0.1.0"
description = "dnd_mas_host using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.5.0",
    "PySimpleGUI>=4.60.0",
    "pymongo>=4.0.0",
    "sentence-transformers>=2.0.0",
]

[project.scripts]
kickoff = "dnd_mas_host.main:kickoff"
run_crew = "dnd_mas_host.main:kickoff"
plot = "dnd_mas_host.main:plot"
run_with_trigger = "dnd_mas_host.main:run_with_trigger"
gui = "dnd_mas_host.interface.interface_agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
